name: Karak
description: 'Karak — now operating as OpenGDP — is a blockchain infrastructure project
  incubated by Andalusia Labs and backed by Pantera Capital. Originally a universal
  restaking protocol (K2 / v1 + v2 staking), it has rebranded to OpenGDP, positioned
  as a global base layer for programmable GDP: an EVM-compatible execution layer unifying
  stablecoin settlement, real-world asset tokenization, and autonomous economic workflow
  orchestration for enterprises, institutions, and governments. The stack spans the
  OpenGDP Network (base execution layer with adaptive multi-proposers, automatic fee
  swaps, dedicated blockspace, native orderbook, private transactions, and stablecoin
  gas), the OpenGDP Network Stack (ONS) for launching bespoke economic networks, and
  a platform layer for moving value, programming assets, and orchestrating GDP. It
  exposes on-chain/EVM infrastructure (precompiles, validators, the K2 bridge) rather
  than a hosted REST API; developer resources are published at docs.opengdp.network.'
